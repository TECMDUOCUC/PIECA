<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de la Piedra</title>
    <link rel="stylesheet" href="assets/css/main.css">
    <script src="assets/js/global.js" defer></script>
    <script src="assets/js/product.js" defer></script>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    
</head>
<body>
    <header>
        <h2>
            <a href="index.html" class="prettyLink">
                Pieca&reg;
            </a>
        </h2>
        <p>&copy; 2026 Pieca&reg;. Todos los derechos reservados.</p>
    </header>

    <main class="productAlign">
        
        <div class="productSquare">
            <img id="product-image" src="assets/images/loading.gif" alt="rock">
        </div>

        <div class="productDetails">
            <h1>
                <ul>
                    <li id="rock-name">
                        Cargando...
                    </li>
                </ul>
            </h1>

            <h2>
                <ul>
                    <li>
                        <i id="price">Test</i>
                    </li>
                </ul>
            </h2>
            
            <table class="productTable">
                <tr>
                    <th>Categoria</th>
                    <th>Valor</th>
                </tr>
                <tr>
                    <td>Peso</td>
                    <td id="weight"></td>
                </tr>
                <tr>
                    <td>Altura</td>
                    <td id="height"></td>
                </tr>
                <tr>
                    <td>Anchura</td>
                    <td id="width"></td>
                </tr>
                <tr>
                    <td>Longitud</td>
                    <td id="length"></td>
                </tr>
                <tr>
                    <td>Volumen</td>
                    <td id="volume"></td>
                </tr>
                <tr>
                    <td>Costo de envio</td>
                    <td id="shipping-fee"></td>
                </tr>
            </table>
            
            <button onclick="comprar()" class="buyButton">
                <i>
                    Añadir a carrito
                </i>
            </button>
        </div>
    </main>

    <footer></footer>

</body>
</html>

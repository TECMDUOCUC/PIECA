<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pieca</title>
        <script src="assets/js/account.js" defer></script>
        <script src="assets/js/global.js" defer></script>
        <link rel="stylesheet" href="assets/css/main.css">
    </head> 

    <body>
        <header>
            <h2>
                <a href="index.html" class="prettyLink">
                    Pieca&reg;
                </a>
            </h2>
            <p>&copy; 2026 Pieca&reg;. Todos los derechos reservados.</p>
        </header>

        <main class="centeredMain">
            <div class="loginBox">
                <h2>Regístrese</h2>
                
                <form id="register" class="contact-form" onsubmit="event.preventDefault();">

                    <div class="row">
                        <input name="name" type="text" placeholder="Nombre" required maxlength="25"
                        oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')"
                        >
                        <input name="second" type="text" placeholder="Apellido" required maxlength="25"
                        oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')"
                        >
                    </div>

                    <input name="second" type="text" placeholder="Nombre de Usuario" required maxlength="25"
                        oninput="this.value = this.value.replace(/[^a-zA-Z]/g, '')"
                    >
                    
                    <input name="email" type="email" placeholder="Correo electrónico" required>
                    <input name="password" type="password" placeholder="Contraseña" required>
                    
                    <button type="submit" id="sendData">Registrar</button>
                    <button type="button" class="secondary-btn" onclick="redirectTo('login.html')">
                        ¿Ya tiene una cuenta?
                    </button>
                </form>
            </div>

        </main>

        <footer></footer>
    </body>
</html>

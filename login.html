        <link rel="icon" type="image/x-icon" href="./favicon.ico">

    </head> 

    <body>
        <header>
            <h2>
                <a href="index.html" class="prettyLink">

        <main class="centeredMain">
            <div class="loginBox">
                <h2>Inicie Sesión</h2>
                
                <form id="login" class="contact-form" onsubmit="event.preventDefault();">
                    <input name="email" type="email" placeholder="Correo electrónico" required maxlength="100">

                    <button type="submit" id="sendData">Iniciar Sesión</button>
                </form>
            </div>

        </main>

        <footer></footer>
